name: CPU checks

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . numpy
      - run: kaifra --help
      - run: python -S -m examples.adaptive_budget
      - run: python -m unittest discover -s tests -v
